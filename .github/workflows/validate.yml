name: validar-curso

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validar estructura, scripts, código y notebooks
        run: ./scripts/validate_repository.sh
      - name: Instalar dependencias académicas
        run: python -m pip install -r requirements-dev.txt
      - name: Ejecutar pruebas HTTP y basadas en propiedades
        run: python -m pytest labs/librereserva/tests modules/07_pruebas -v
      - name: Construir y registrar la imagen del commit
        run: |
          mkdir -p dist
          docker build -f labs/librereserva/Containerfile -t localhost/librereserva:${{ github.sha }} labs/librereserva
          docker image inspect localhost/librereserva:${{ github.sha }} --format '{{.Id}}' > dist/image-id.txt
          docker save localhost/librereserva:${{ github.sha }} | gzip > dist/librereserva-image.tar.gz
      - name: Conservar imagen y evidencia por tres días
        uses: actions/upload-artifact@v7
        with:
          name: librereserva-${{ github.sha }}
          path: dist/
          retention-days: 3
          if-no-files-found: error
